# Build the prebuilt TAPPaaS NixOS VM template image on Codeberg CI (Woodpecker)
# and publish it as a GITHUB Release asset — the Woodpecker port of
# .github/workflows/build-nixos-template-image.yml (Codeberg migration, Phase 3).
#
# Why the release still goes to GitHub: per the migration decision (see
# docs/codeberg-migration.md → Decisions), the multi-GB qcow2 images stay on
# GitHub Releases — Codeberg discourages large-binary hosting. Only the BUILD
# moves here; consumers keep fetching github.com/TAPPaaS/TAPPaaS/releases/….
#
# Trigger: push a tag `nixos-template-v<version>` to Codeberg, or start the
# pipeline manually from the Woodpecker UI (manual runs on an untagged commit
# label the release 0.0-dev).
#
# Required repo secret (Woodpecker → repo settings → Secrets):
#   github_release_token — a GitHub PAT with contents:write on TAPPaaS/TAPPaaS,
#                          used only to create the release + upload the asset.
#                          (Unlike GitHub Actions there is no auto GITHUB_TOKEN.)
#
# NOTE (needs live validation): the image is ~6 GB raw before zstd; confirm the
# Codeberg CI runner's disk/time limits accommodate the build. The GitHub
# Actions workflow is kept as a fallback until this pipeline has produced one
# good release (then the GHA copy can be retired).
#
# The OPNsense image pipeline is NOT ported: it needs a FreeBSD VM to write
# UFS2 (mdconfig/growfs), which container-based shared runners cannot provide.
# It stays on GitHub Actions — push its `opnsense-firewall-v*` tag to the
# `github` remote (see docs/codeberg-migration.md → Risks).

when:
  - event: tag
    ref: refs/tags/nixos-template-v*
  - event: manual

steps:
  build-and-release:
    image: docker.io/nixos/nix:latest
    environment:
      GITHUB_TOKEN:
        from_secret: github_release_token
    commands:
      - |
        set -euo pipefail

        # ── version from the tag (manual/untagged runs → 0.0-dev) ──────────
        case "${CI_COMMIT_TAG:-}" in
          nixos-template-v*) VERSION="${CI_COMMIT_TAG#nixos-template-v}" ;;
          *)                 VERSION="0.0-dev" ;;
        esac
        TAG="nixos-template-v${VERSION}"
        echo "Building tappaas-nixos image version ${VERSION} (release tag ${TAG})"

        # ── publish helper (generated first; run at the end under nix shell) ─
        cat > publish.sh <<'PUBLISH'
        set -euo pipefail
        API="https://api.github.com/repos/TAPPaaS/TAPPaaS"
        AUTH="Authorization: Bearer ${GITHUB_TOKEN}"
        # ensure the release exists for the tag (reuse if already created)
        rel_id="$(curl -fsSL -H "${AUTH}" "${API}/releases/tags/${TAG}" 2>/dev/null | jq -r '.id // empty' || true)"
        if [ -z "${rel_id}" ]; then
          payload="$(jq -n --arg t "${TAG}" --arg n "NixOS template ${VERSION}" \
                        --rawfile b release-notes.md '{tag_name:$t, name:$n, body:$b}')"
          rel_id="$(curl -fsSL -X POST -H "${AUTH}" -H 'Content-Type: application/json' \
                      -d "${payload}" "${API}/releases" | jq -r '.id')"
        fi
        echo "GitHub release id: ${rel_id}"
        curl -fsSL -X POST -H "${AUTH}" -H 'Content-Type: application/octet-stream' \
          --data-binary @tappaas-nixos.qcow2.zst \
          "https://uploads.github.com/repos/TAPPaaS/TAPPaaS/releases/${rel_id}/assets?name=tappaas-nixos.qcow2.zst" \
          | jq -r '.browser_download_url'
        PUBLISH

        # ── build the EFI qcow2 image (same invocation as the GHA workflow) ─
        mkdir -p /etc/nix
        echo "experimental-features = nix-command flakes" >> /etc/nix/nix.conf
        nix build --print-build-logs --no-write-lock-file \
          'path:./src/foundation/templates#packages.x86_64-linux.image' \
          -o result-image

        # ── compress: stable, unversioned asset name (the TAG versions it) ──
        src="$(ls result-image/*.qcow2)"
        out="tappaas-nixos.qcow2.zst"
        nix shell --no-write-lock-file nixpkgs#zstd -c \
          zstd -T0 -19 --long=27 "$(readlink -f "$src")" -o "$out"
        ls -lh "$out"

        # ── release notes ──────────────────────────────────────────────────
        {
          echo "## tappaas-nixos ${VERSION}"
          echo ""
          echo "Prebuilt, pre-configured NixOS VM template image (EFI qcow2, zstd-compressed)."
          echo "Built on Codeberg CI (Woodpecker); hosted on GitHub Releases per the"
          echo "image-hosting decision (docs/codeberg-migration.md)."
          echo ""
          echo "Import on a Proxmox node:"
          echo '```'
          echo "zstd -d ${out} -o tappaas-nixos.qcow2"
          echo "qm importdisk <vmid> tappaas-nixos.qcow2 <storage>"
          echo '```'
          echo ""
          echo "Or just run \`install-platform.sh\` on the first node, which does this for you."
        } > release-notes.md

        # ── publish to GITHUB Releases (REST: ensure release, upload asset) ─
        export VERSION TAG
        nix shell --no-write-lock-file nixpkgs#curl nixpkgs#jq -c bash ./publish.sh
