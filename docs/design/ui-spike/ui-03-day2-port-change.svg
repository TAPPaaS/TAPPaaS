<text x='856' y='526' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='start'>→</text>
<text x='872' y='526' font-size='11' fill='#1f2328' font-weight='600' text-anchor='start'>access vlan 430 (iotCams)</text>
