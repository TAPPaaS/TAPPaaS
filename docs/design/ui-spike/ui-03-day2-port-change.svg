<text x='372' y='598' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start' font-family='JetBrains Mono, Menlo, monospace'>disruption</text>
<text x='476' y='598' font-size='11' fill='#1f2328' font-weight='normal' text-anchor='start'>a device on port 1 loses every VLAN but 430 — nothing is cabled there today</text>
