<rect x='436' y='274' width='250' height='26' rx='6' fill='#fbfbfc' stroke='#d0d4da' stroke-width='1' opacity='1'/>
<text x='446' y='291' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start'>access  (was: trunk)</text>
<text x='344' y='324' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='start'>zone</text>
<rect x='436' y='310' width='250' height='26' rx='6' fill='#fbfbfc' stroke='#d0d4da' stroke-width='1' opacity='1'/>
<text x='446' y='327' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start'>iotCams · vlan 430</text>
<text x='344' y='360' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='start'>description</text>
<rect x='436' y='346' width='250' height='26' rx='6' fill='#fbfbfc' stroke='#d0d4da' stroke-width='1' opacity='1'/>
<text x='446' y='363' font-size='12' fill='#1f2328' font-weight='normal' text-anchor='start'>garden camera</text>
<text x='344' y='404' font-size='11' fill='#6b7280' font-weight='normal' text-anchor='start'>The verbs the UI will run — exactly what you would type on tappaas-cicd:</text>
<rect x='344' y='414' width='764' height='62' rx='6' fill='#1f2a37' stroke='#1f2a37' stroke-width='1' opacity='1'/>
<text x='356' y='436' font-size='11.5' fill='#e5e7eb' font-weight='normal' text-anchor='start' font-family='JetBrains Mono, Menlo, monospace'>switch-controller update-port 'USW Pro XG 10 PoE' 1 --type device --mode access \</text>
<text x='356' y='452' font-size='11.5' fill='#e5e7eb' font-weight='normal' text-anchor='start' font-family='JetBrains Mono, Menlo, monospace'>    --zone iotCams --description 'garden camera'</text>
<text x='356' y='468' font-size='11.5' fill='#9aa4b2' font-weight='normal' text-anchor='start' font-family='JetBrains Mono, Menlo, monospace'>switch-controller reconcile --apply          # programs the switch through unifi-os</text>
<text x='344' y='494' font-size='12' fill='#6b7280' font-weight='600' text-anchor='start'>Preview — switch-controller reconcile (delta, nothing applied yet)</text>
<rect x='344' y='504' width='764' height='118' rx='6' fill='#fbfbfc' stroke='#d0d4da' stroke-width='1' opacity='1'/>
